<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Agenda de Contactos - 2º Bachillerato</title>
    <!-- Importamos Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- RUTA CORREGIDA PARA FLASK -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto py-12 px-4">
        <!-- Header del Proyecto -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-4xl font-black text-blue-800 tracking-tight">Agenda Contactos</h1>
                <p class="text-gray-500 font-medium">Proyecto Final de Programación - 2º Bachillerato</p>
            </div>
            <button onclick="window.toggleModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform hover:scale-105 active:scale-95">
                + Nuevo Contacto
            </button>
        </header>

        <!-- Buscador Inteligente -->
        <div class="relative mb-8">
            <input type="text" id="inputBusqueda" placeholder="Buscar por nombre o móvil..." class="w-full p-4 pl-12 rounded-2xl border-none shadow-md focus:ring-2 focus:ring-blue-500 outline-none">
            <span class="absolute left-4 top-4 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </span>
        </div>

        <!-- Lista Dinámica de Contactos -->
        <div id="gridContactos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cargado por JavaScript -->
        </div>

        <!-- Mensaje si no hay nada -->
        <div id="vacio" class="hidden text-center py-20 text-gray-400">
            <p class="text-xl">No hay contactos guardados en la base de datos.</p>
        </div>
    </div>

    <!-- Modal para Agregar Contacto -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
            <div class="p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Añadir Nuevo Amigo</h2>
                <form id="formNuevo" class="space-y-4">
                    <input type="text" id="nom" required placeholder="Nombre completo" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="tel" id="tel" required placeholder="Teléfono" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="email" id="ema" placeholder="Correo electrónico" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <select id="cat" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Amigos">Amigos</option>
                        <option value="Familia">Familia</option>
                        <option value="Clase">Clase</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <div class="flex gap-4 pt-4">
                        <button type="button" onclick="window.toggleModal(false)" class="flex-1 py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition-colors">Cancelar</button>
                        <button type="submit" class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-colors">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- RUTA CORREGIDA PARA EL SCRIPT -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
